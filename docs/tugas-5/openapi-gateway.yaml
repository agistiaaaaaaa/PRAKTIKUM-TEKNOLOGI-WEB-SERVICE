info:
  title: WisataKu API Gateway
  description: "Titik masuk tunggal WisataKu. Meneruskan request ke
    service-destinasi dan service-reservasi melalui TCP. Mendukung URI
    versioning: /v1 (hargaTiket) dan /v2 (hargaDewasa, hargaAnak); path tanpa
    prefix versi setara v1."
  version: "2.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        nama:
          type: string
          example: Siti
        email:
          type: string
          example: siti@example.com
        password:
          type: string
          example: rahasia123
          minLength: 8
      required:
        - nama
        - email
        - password
    RegisterResponse:
      type: object
      properties:
        id:
          type: number
          example: 5
        nama:
          type: string
          example: Siti
        email:
          type: string
          example: siti@example.com
        role:
          type: string
          example: wisatawan
      required:
        - id
        - nama
        - email
        - role
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: number
          example: 404
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Destinasi dengan id 999 tidak ditemukan
        error:
          type: string
          example: Not Found
      required:
        - statusCode
        - message
        - error
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: siti@example.com
        password:
          type: string
          example: rahasia123
      required:
        - email
        - password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
      required:
        - access_token
        - token_type
    Destinasi:
      type: object
      properties:
        id:
          type: number
          example: 1
        nama:
          type: string
          example: Pantai Kuta Mandalika
        kategori:
          type: string
          example: Pantai
        lokasi:
          type: string
          example: Kuta, Lombok Tengah
          nullable: true
        deskripsi:
          type: string
          example: Pantai berpasir putih di kawasan Mandalika.
          nullable: true
        hargaTiket:
          type: number
          example: 15000
        ratingRata:
          type: number
