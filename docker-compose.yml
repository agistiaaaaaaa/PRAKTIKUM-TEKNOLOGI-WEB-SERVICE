# Menjalankan seluruh sistem WisataKu: docker compose up --build -d
# Nilai rahasia dibaca dari file .env (salin dari .env.example).
# Hanya gateway yang dipublikasikan ke host; microservice dan MariaDB hanya dapat
# dijangkau di jaringan internal Docker.

x-database-url: &database-url mysql://${MARIADB_USER:-wisataku_user}:${MARIADB_PASSWORD:?isi MARIADB_PASSWORD di .env}@mariadb:3306/${MARIADB_DATABASE:-wisataku_db}

services:
  mariadb:
    image: mariadb:11
    # Migrasi dibuat di MariaDB Windows yang tidak membedakan huruf besar/kecil nama tabel.
    # Opsi ini menyamakan perilaku di Linux agar migrasi berjalan identik.
    command: --lower-case-table-names=1
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?isi MARIADB_ROOT_PASSWORD di .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wisataku_db}
      MARIADB_USER: ${MARIADB_USER:-wisataku_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?isi MARIADB_PASSWORD di .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Sekali jalan: menerapkan migrasi lalu mengisi data contoh (seed aman diulang).
  migrate:
    build:
      context: .
      dockerfile: service-destinasi/Dockerfile
      target: builder
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: *database-url
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@wisataku.id}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?isi SEED_ADMIN_PASSWORD di .env}
    depends_on:
      mariadb:
        condition: service_healthy

  service-destinasi:
    build:
      context: .
      dockerfile: service-destinasi/Dockerfile
    environment:
      DATABASE_URL: *database-url
      SERVICE_DESTINASI_PORT: 5001
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  service-reservasi:
    build:
      context: .
      dockerfile: service-reservasi/Dockerfile
    environment:
      DATABASE_URL: *database-url
      SERVICE_RESERVASI_PORT: 5002
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      # Gateway mengakses tabel User untuk register/login
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      GATEWAY_PORT: 3000
      SERVICE_DESTINASI_HOST: service-destinasi
      SERVICE_DESTINASI_PORT: 5001
      SERVICE_RESERVASI_HOST: service-reservasi
      SERVICE_RESERVASI_PORT: 5002
      RPC_TIMEOUT_MS: ${RPC_TIMEOUT_MS:-5000}
    depends_on:
      - service-destinasi
      - service-reservasi
    restart: unless-stopped

volumes:
  mariadb_data:
